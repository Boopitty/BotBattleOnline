<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bot Battle</title>
        <link rel="stylesheet" href="css/game.css" />
        <script src="js/websocket.js" defer></script>
        <script src="js/Canvas.js" defer></script>
    </head>
    <body>
        <div class="button-container">
            <button id="start-game-btn" class="button" style="display: block;">Start Game</button>
            <button id="stop-game-btn" class="button" style="display: none;">Stop Game</button>
        </div>
        <canvas id="game-canvas" width="800" height="400" style="border: 1px solid black; display: block; margin: 20px auto;"></canvas>
        <button id="attack-btn" class="button" style="display: none;">Attack</button>
        <form id="game-form">
			<input
				class="input-area"
				type="text"
				id="game-input"
				placeholder="Type 'help' to see commands."
				required
			/>
			<div class="button-container">
				<button id="game-submit" type="submit" class="button">Enter</button>
			</div>
		</form>
    </body>
</html>
