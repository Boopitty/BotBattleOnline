<!DOCTYPE html>
<html lang="eng">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Bot Battle</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="nav-bar">
			<h1>
				Bot Battle
				<span class="subtitle">Clank 'em up!</span>
			</h1>
		</div>
		<div id="command section" style="display: block">
			<h2>Enter a command</h2>
			<form id="command input">
				<input
					class="input-area"
					type="text"
					id="command"
					placeholder="Command placeholder"
					required
				/>
				<div class="button-container">
					<button type="submit">Enter</button>
				</div>
			</form>
		</div>
	</body>
</html>
