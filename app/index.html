<!DOCTYPE html>
<html lang="eng">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Bot Battle</title>
		<link rel="stylesheet" href="css/styles.css" />
		<script src="js/main.js" defer></script>
		<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js" defer></script>
		<script type="module" src="js/Game.js" defer></script>
		<script src="js/websocket.js" defer></script>
	</head>
	<body>
		<div class="nav-bar">
			<h1>
				Bot Battle!
				<span class="subtitle">--Robot Arena--</span>
			</h1>
			<button id="login" type="button" class="button">login</button>
		</div>
		<div id="game-container"></div>
		<div id="command-section">
			<h2>Enter a command</h2>
			<form id="command-form">
				<input
					class="input-area"
					type="text"
					id="command"
					placeholder="Type anything to echo"
					required
				/>
				<div class="button-container">
					<button type="submit" class="button">Enter</button>
				</div>
			</form>
		</div>
		<div id="command-log" class="log">
		</div>
	</body>
</html>
