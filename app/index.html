<!DOCTYPE html>
<html lang="eng">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Bot Battle</title>
		<link rel="stylesheet" href="css/styles.css" />
		<script src="js/main.js" defer></script>
		<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js" defer></script>
		<script type="module" src="js/Game.js" defer></script>
		<script src="js/websocket.js" defer></script>
	</head>
	<body>
		<div class="nav-bar">
			<h1>
				Bot Battle!
				<span class="subtitle">--Robot Arena--</span>
			</h1>
			<div class="button-container">
				<button id="login" type="button" class="button" display="none">Login</button>
				<button id="cancel-login" type="button" class="button" display="none">Cancel</button>
				<button id="logout" type="button" class="button" display="none">Logout</button>
				<button id="Reset" type="button" class="button" onclick="resetUsers()">Reset</button>
			</div>
		</div>
		<div id="login-container">
			<form id="login-form">
				<input
					class="input-area"
					type="username"
					id="username"
					placeholder="Username"
					required
				/>
				<input
					class="input-area"
					type="password"
					id="password"
					placeholder="Password"
					required
				/>
				<div class="button-container">
					<button id="submit-login" type="submit" class="button">Submit</button>
					<button id="switch-to-new" type="button" class="button">Create Account</button>
				</div>
			</form>
			<form id="new-profile-form">
				<input
					class="input-area"
					type="username"
					id="new-username"
					placeholder="Username"
					required
				/>
				<input
					class="input-area"
					type="password"
					id="new-password"
					placeholder="Password"
					required
				/>
				<input
					class="input-area"
					type="password"
					id="confirm-password"
					placeholder="Confirm Password"
					required
				/>
				<div class="button-container">
					<button id="submit-new-profile" type="submit" class="button">submit</button>
					<button id="switch-to-login" type="button" class="button">login</button>
				</div>
			</form>
		</div>
		</form>
		<div id="game-container"></div>
		<div id="command-section">
			<h2>Enter a command</h2>
			<form id="command-form">
				<input
					class="input-area"
					type="text"
					id="command"
					placeholder="Type anything to echo"
					required
				/>
				<div class="button-container">
					<button type="submit" class="button">Enter</button>
				</div>
			</form>
		</div>
		<div id="command-log" class="log"></div>
	</body>
</html>
