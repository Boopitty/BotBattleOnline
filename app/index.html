<!DOCTYPE html>
<html lang="eng">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Bot Battle</title>
		<link rel="stylesheet" href="css/styles.css" />
		<script src="js/app.js" defer></script>
		<script src="js/websocket.js" defer></script>
		<script src="js/game.js" defer></script>
	</head>
	<body>
		<div class="nav-bar">
			<h1>
				Bot Battle!
				<span class="subtitle">--Robot Arena--</span>
			</h1>
		</div>
		<iframe id="game_widget" src="game.html" style="width: 100%; height: 500px; border: none;"></iframe>
		<div id="command-section">
			<h2>Enter a command</h2>
			<form id="command-form">
				<input
					class="input-area"
					type="text"
					id="command"
					placeholder="Type 'help' to see commands."
					required
				/>
				<div class="button-container">
					<button type="submit" class="button">Enter</button>
				</div>
			</form>
		</div>
		<div id="command-log" class="log">
		</div>
	</body>
</html>
